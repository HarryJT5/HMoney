# .github/workflows/hmoney_intraday.yml
name: HMoney Intraday

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Every 15 min during US market hours (UTC)
    - cron: "*/15 14-20 * * 1-5"
    # Last run at 21:00 UTC
    - cron: "0 21 * * 1-5"

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: hmoney-main
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute rolling shard index
        id: shard
        run: |
          SHARDS=10
          DOY=$(date -u +%j)
          IDX=$((10#$DOY % SHARDS))
          echo "index=$IDX" >> $GITHUB_OUTPUT
          echo "Shard index: $IDX / $SHARDS"

      - name: Run pipeline (intraday)
        env:
          HMONEY_MODE: "intraday"
          HMONEY_LOCAL_TZ: "America/Los_Angeles"
          UNIVERSE_SHARDS: "10"
          UNIVERSE_SHARD_INDEX: ${{ steps.shard.outputs.index }}
        run: |
          python -m src.pipeline

      - name: Mirror lightweight outputs to docs/ for GitHub Pages
        run: |
          mkdir -p docs
          cp -f public/state.json docs/state.json
          cp -f public/daily_brief.html docs/daily_brief.html
          cp -f public/daily_brief.md docs/daily_brief.md

          # Patch docs/state.json so evidence_pack_index.base_path is docs-relative
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/state.json")
          s = json.loads(p.read_text(encoding="utf-8"))

          epi = s.get("evidence_pack_index") or {}
          bp = (epi.get("base_path") or "").lstrip("/")

          if bp.startswith("public/"):
              bp = bp[len("public/"):]
          epi["base_path"] = bp

          s["evidence_pack_index"] = epi
          p.write_text(json.dumps(s, indent=2), encoding="utf-8")
          print("docs/state.json base_path =", bp)
          PY

      - name: Commit intraday outputs (public + docs lightweight)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # public (repo artifacts)
          git add public/state.json public/daily_brief.md public/daily_brief.html || true

          # docs (Pages artifacts)
          git add docs/state.json docs/daily_brief.md docs/daily_brief.html || true

          git commit -m "Intraday HMoney update" || echo "No changes"

          git pull --rebase origin main || true
          git push