# .github/workflows/hmoney_intraday.yml
name: HMoney Intraday

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Every 15 min during US market hours (UTC)
    - cron: "*/15 14-20 * * 1-5"
    # Last run at 21:00 UTC
    - cron: "0 21 * * 1-5"

concurrency:
  group: hmoney-intraday
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute rolling shard index
        id: shard
        run: |
          SHARDS=10
          DOY=$(date -u +%j)
          IDX=$((10#$DOY % SHARDS))
          echo "index=$IDX" >> $GITHUB_OUTPUT
          echo "Shard index: $IDX / $SHARDS"

      - name: Run pipeline (intraday)
        env:
          HMONEY_MODE: "intraday"
          HMONEY_LOCAL_TZ: "America/Los_Angeles"
          UNIVERSE_SHARDS: "10"
          UNIVERSE_SHARD_INDEX: ${{ steps.shard.outputs.index }}

          # ✅ Publish targets (GitHub Pages serves from docs/)
          HMONEY_EVIDENCE_PACK_BASE: "docs/evidence_packs"
          HMONEY_STATE_JSON: "docs/state.json"
          HMONEY_DAILY_BRIEF_MD: "docs/daily_brief.md"
          HMONEY_DAILY_BRIEF_HTML: "docs/daily_brief.html"
        run: |
          python -m src.pipeline

          - name: Verify packs exist for state base_path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path("docs/state.json").read_text(encoding="utf-8"))
          bp = (s.get("evidence_pack_index", {}) or {}).get("base_path", "").lstrip("/")
          if not bp:
            raise SystemExit("state.json missing evidence_pack_index.base_path")

          folder = Path("docs") / bp
          if not folder.exists():
           raise SystemExit(f"Missing pack folder: {folder}")

         n = len(list(folder.glob("*.json")))
          if n == 0:
            raise SystemExit(f"No pack JSON files found in: {folder}")

          if not (folder / "SPY.json").exists():
            raise SystemExit(f"Missing SPY.json in: {folder}")

          print("OK:", folder, "json_count=", n)
          PY
          
      - name: Commit intraday outputs (docs only)
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage publish artifacts
          git add -A docs
          git add data/forced_movers.json || true

          # Preserve hand-maintained dashboard file
          git reset docs/index.html || true

          # Nothing to commit? exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Intraday HMoney update"

          # Sync + push (avoid dirty-tree rebase failure)
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              exit 0
            fi
            echo "Push failed, retrying..."
            sleep $((i*5))
          done

          echo "Push failed after retries"
          exit 1