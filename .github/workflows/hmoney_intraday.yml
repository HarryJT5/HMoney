# .github/workflows/hmoney_intraday.yml
name: HMoney Intraday

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Runs every 15 minutes between 14:00 and 20:59 UTC, Mon–Fri
    - cron: "*/15 14-20 * * 1-5"
    # Runs at 21:00 UTC, Mon–Fri (last run)
    - cron: "0 21 * * 1-5"

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      # Shared group with nightly so they don't fight over pushes
      group: hmoney-main
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute rolling shard index
        id: shard
        run: |
          SHARDS=10
          DOY=$(date -u +%j)
          IDX=$((10#$DOY % SHARDS))
          echo "index=$IDX" >> $GITHUB_OUTPUT
          echo "Shard index: $IDX / $SHARDS"

      - name: Run pipeline (intraday)
        env:
          HMONEY_MODE: "intraday"
          HMONEY_LOCAL_TZ: "America/Los_Angeles"
          UNIVERSE_SHARDS: "10"
          UNIVERSE_SHARD_INDEX: ${{ steps.shard.outputs.index }}
        run: |
          python -m src.pipeline

      - name: Commit intraday outputs (state + brief only)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Add only the lightweight artifacts
          git add public/state.json public/daily_brief.md public/daily_brief.html || true
          git commit -m "Intraday HMoney update" || echo "No changes"

          # Pull/rebase then push (handles rare overlap)
          git pull --rebase origin main || true
          git push