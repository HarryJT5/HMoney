# .github/workflows/hmoney_nightly.yml
name: HMoney Nightly Newsletter

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"   # Soon after US market close (DST-safe)

concurrency:
  group: hmoney-nightly
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute rolling shard index
        id: shard
        run: |
          SHARDS=10
          DOY=$(date -u +%j)
          IDX=$((10#$DOY % SHARDS))
          echo "index=$IDX" >> $GITHUB_OUTPUT
          echo "Shard index: $IDX / $SHARDS"

      - name: Run pipeline (nightly)
        env:
          HMONEY_MODE: "daily"
          HMONEY_LOCAL_TZ: "America/Los_Angeles"
          UNIVERSE_SHARDS: "10"
          UNIVERSE_SHARD_INDEX: ${{ steps.shard.outputs.index }}

          # ✅ Publish targets (GitHub Pages serves from docs/)
          HMONEY_EVIDENCE_PACK_BASE: "docs/evidence_packs"
          HMONEY_STATE_JSON: "docs/state.json"
          HMONEY_DAILY_BRIEF_MD: "docs/daily_brief.md"
          HMONEY_DAILY_BRIEF_HTML: "docs/daily_brief.html"
        run: |
          python -m src.pipeline

      - name: Commit nightly outputs (docs only)
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage publish artifacts
          git add -A docs

          # If you still want the nightly job to version the universe CSV, keep this line.
          # If not, delete it.
          git add data/universe_all.csv || true

          # Preserve hand-maintained dashboard file
          git reset docs/index.html || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Nightly HMoney update"

          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep $((i*5))
          done

          echo "Failed to push after retries."
          exit 1