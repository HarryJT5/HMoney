# .github/workflows/hmoney_nightly.yml
name: HMoney Nightly Newsletter

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1-5"   # Weekdays 02:15 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      # Shared group with intraday so they don't fight over pushes
      group: hmoney-main
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (nightly)
        env:
          HMONEY_MODE: "daily"
          HMONEY_LOCAL_TZ: "America/Los_Angeles"
          UNIVERSE_SHARDS: "10"
          UNIVERSE_SHARD_INDEX: "0"
        run: |
          python -m src.pipeline

      - name: Commit nightly outputs (public/)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add public/ data/universe_all.csv || true
          git commit -m "Nightly HMoney update" || echo "No changes"

          # Avoid "fetch first" errors if intraday pushed recently
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep 5
          done

          echo "Failed to push after retries."
          exit 1