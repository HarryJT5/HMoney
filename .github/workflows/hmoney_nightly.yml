# .github/workflows/hmoney_nightly.yml
name: HMoney Nightly Newsletter

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"   # Soon after US market close (DST-safe)

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: hmoney-main
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute rolling shard index
        id: shard
        run: |
          SHARDS=10
          DOY=$(date -u +%j)
          IDX=$((10#$DOY % SHARDS))
          echo "index=$IDX" >> $GITHUB_OUTPUT
          echo "Shard index: $IDX / $SHARDS"

      - name: Run pipeline (nightly)
        env:
          HMONEY_MODE: "daily"
          HMONEY_LOCAL_TZ: "America/Los_Angeles"
          UNIVERSE_SHARDS: "10"
          UNIVERSE_SHARD_INDEX: ${{ steps.shard.outputs.index }}
        run: |
          python -m src.pipeline

      - name: Mirror site outputs to docs/ for GitHub Pages
        run: |
          mkdir -p docs

          # Copy brief + state
          cp -f public/state.json docs/state.json
          cp -f public/daily_brief.html docs/daily_brief.html
          cp -f public/daily_brief.md docs/daily_brief.md

          # Copy evidence packs (nightly only)
          rm -rf docs/evidence_packs
          cp -rf public/evidence_packs docs/evidence_packs

          # Patch docs/state.json so evidence_pack_index.base_path is docs-relative
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("docs/state.json")
          s = json.loads(p.read_text(encoding="utf-8"))

          epi = s.get("evidence_pack_index") or {}
          bp = (epi.get("base_path") or "").lstrip("/")

          if bp.startswith("public/"):
              bp = bp[len("public/"):]
          epi["base_path"] = bp

          s["evidence_pack_index"] = epi
          p.write_text(json.dumps(s, indent=2), encoding="utf-8")
          print("docs/state.json base_path =", bp)
          PY

      - name: Commit nightly outputs (public + docs)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # public (full artifacts)
          git add public/ data/universe_all.csv || true

          # docs (Pages artifacts)
          git add docs/state.json docs/daily_brief.md docs/daily_brief.html docs/evidence_packs || true

          git commit -m "Nightly HMoney update" || echo "No changes"

          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep 5
          done

          echo "Failed to push after retries."
          exit 1