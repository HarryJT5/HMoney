name: HMoney Nightly Newsletter

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    # Weekdays. After US market close (UTC; "DST-safe" in the sense it still runs daily).
    - cron: "30 22 * * 1-5"

concurrency:
  group: hmoney-nightly
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: rebuild universe catalog nightly if you have the script
      - name: Rebuild universe catalog (if script exists)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/build_universe.py ]; then
            python scripts/build_universe.py
          else
            echo "scripts/build_universe.py not found; skipping universe rebuild."
          fi

      - name: Compute rolling shard index
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          SHARDS=10
          DOY=$(date -u +%j)
          IDX=$((10#$DOY % SHARDS))
          echo "index=$IDX" >> $GITHUB_OUTPUT
          echo "Shard index: $IDX / $SHARDS"

      - name: Run pipeline (nightly)
        env:
          HMONEY_MODE: "daily"
          HMONEY_LOCAL_TZ: "America/Los_Angeles"
          UNIVERSE_SHARDS: "10"
          UNIVERSE_SHARD_INDEX: ${{ steps.shard.outputs.index }}

          # ✅ Publish targets (GitHub Pages serves from docs/)
          HMONEY_EVIDENCE_PACK_BASE: "docs/evidence_packs"
          HMONEY_STATE_JSON: "docs/state.json"
          HMONEY_DAILY_BRIEF_MD: "docs/daily_brief.md"
          HMONEY_DAILY_BRIEF_HTML: "docs/daily_brief.html"
        run: |
          python -m src.pipeline

      - name: Guard — verify packs exist for state base_path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("docs/state.json")
          if not state_path.exists():
            raise SystemExit("docs/state.json not found (pipeline did not write it)")

          s = json.loads(state_path.read_text(encoding="utf-8"))
          bp = (s.get("evidence_pack_index", {}) or {}).get("base_path", "").lstrip("/")
          if not bp:
            raise SystemExit("state.json missing evidence_pack_index.base_path")

          folder = Path("docs") / bp
          if not folder.exists():
            raise SystemExit(f"Missing pack folder: {folder}")

          n = len(list(folder.glob("*.json")))
          if n == 0:
            raise SystemExit(f"No pack JSON files found in: {folder}")

          if not (folder / "SPY.json").exists():
            raise SystemExit(f"Missing SPY.json in: {folder}")

          print("OK:", folder, "json_count=", n)
          PY

      - name: Commit nightly outputs (docs only)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Stage publish artifacts
          git add -A docs
          git add data/forced_movers.json || true
          git add data/universe_all.csv || true

          # Preserve hand-maintained dashboard file
          git reset docs/index.html || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Nightly HMoney update"

          for i in 1 2 3; do
            git fetch origin
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              exit 0
            fi
            echo "Push failed (attempt $i). Retrying..."
            sleep $((i*5))
          done

          echo "Failed to push after retries."
          exit 1